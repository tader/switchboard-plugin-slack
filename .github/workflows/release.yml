name: Publish reviewed version
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: slack-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - run: npm run check
      - run: npm test
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: tader/switchboard
          ref: 55e538e6e20f6f16af20a632b02dc37825917149
          path: switchboard-core
      - run: npm ci --prefix switchboard-core
      - run: npm run integration
        env:
          SWITCHBOARD_ROOT: ${{ github.workspace }}/switchboard-core
      - name: Publish version if new
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(node -p "JSON.parse(require('fs').readFileSync('package.json')).version")
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "Version v$version is already published."
          else
            gh release create "v$version" --target "$GITHUB_SHA" --title "Slack v$version" --generate-notes
          fi
      - name: Mark published release PRs as tagged
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          version=$(node -p "JSON.parse(require('fs').readFileSync('package.json')).version")
          gh release view "v$version" >/dev/null
          gh label create 'autorelease: tagged' --color 1D76DB --force
          gh pr list --state merged --base main --head release-please--branches--main--components--switchboard-plugin-slack \
            --label 'autorelease: pending' --json number,title,mergeCommit \
            --jq ".[] | select(.title == \"chore(main): release $version\") | \"\(.number) \(.mergeCommit.oid)\"" |
          while read -r number sha; do
            git merge-base --is-ancestor "$sha" "$GITHUB_SHA"
            gh pr edit "$number" --remove-label 'autorelease: pending' --add-label 'autorelease: tagged'
          done
