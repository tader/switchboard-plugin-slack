name: Check Slack plugin
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci
      - run: npm run check
      - run: npm test
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: tader/switchboard
          ref: 55e538e6e20f6f16af20a632b02dc37825917149
          path: switchboard-core
      - run: npm ci --prefix switchboard-core
      - run: npm run integration
        env:
          SWITCHBOARD_ROOT: ${{ github.workspace }}/switchboard-core
      - name: Checkout staged contract core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: tader/switchboard
          ref: 07fa6b3b34ba0819db7029083939402cb1217e3d
          path: switchboard-contract-core
      - run: npm ci --prefix switchboard-contract-core
      - run: npm run integration:contracts
        env:
          SWITCHBOARD_ROOT: ${{ github.workspace }}/switchboard-contract-core
